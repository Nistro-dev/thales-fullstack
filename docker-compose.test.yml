services:
  mysql_test:
    image: mysql:8.0
    container_name: thales_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: thales_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptest_root_password", "--silent"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - test_network

  thales_backend_test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thales_backend_test
    volumes:
      - thales_uploads_test:/app/uploads
    environment:
      - NODE_ENV=integration_test
      - PORT=3000
      - DB_HOST=mysql_test
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=thales_test
      - DB_PORT=3306
      - JWT_SECRET=test_jwt_secret_key_for_testing_only
    depends_on:
      mysql_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    networks:
      - test_network

  thales_frontend_test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thales_frontend_test
    depends_on:
      thales_backend_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - test_network

volumes:
  mysql_test_data:
    driver: local
  thales_uploads_test:
    driver: local

networks:
  test_network:
    driver: bridge
