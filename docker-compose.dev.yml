services:
  thales_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.thales.dev.codeforgestudio.fr/api
    container_name: thales_frontend_dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thales_frontend_dev.rule=Host(`thales.dev.codeforgestudio.fr`)"
      - "traefik.http.routers.thales_frontend_dev.entrypoints=websecure"
      - "traefik.http.routers.thales_frontend_dev.tls=true"
      - "traefik.http.routers.thales_frontend_dev.tls.certresolver=letsencrypt"
      - "traefik.http.services.thales_frontend_dev.loadbalancer.server.port=80"
    networks:
      - web
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5

  thales_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thales_backend_dev
    volumes:
      - thales_uploads:/app/uploads
    environment:
      - PORT=3000
      - BASE_URL=https://api.thales.dev.codeforgestudio.fr
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=smtp.test.developpement@gmail.com
      - SMTP_PASS=ycll wlkh edhs tubp
      - SMTP_FROM="LAMY POWER" <smtp.test.developpement@gmail.com>
      - FRONTEND_URL=https://thales.dev.codeforgestudio.fr
      - ADMIN_EMAIL=contact@thales.fr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thales_backend_dev.tls.certresolver=letsencrypt"
      - "traefik.http.services.thales_backend_dev.loadbalancer.server.port=3000"
      - "traefik.http.routers.thales_backend_dev.rule=Host(`api.thales.dev.codeforgestudio.fr`)"
      - "traefik.http.routers.thales_backend_dev.entryPoints=websecure"
      - "traefik.http.routers.thales_backend_dev.tls=true"
      - "traefik.http.middlewares.thales_backend_dev.headers.accesscontrolalloworiginlist=https://thales.dev.codeforgestudio.fr"
      - "traefik.http.middlewares.thales_backend_dev.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH"
      - "traefik.http.middlewares.thales_backend_dev.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.thales_backend_dev.headers.accesscontrolallowcredentials=true"
      - "traefik.http.routers.thales_backend_dev.middlewares=thales_backend_dev"
    networks:
      - web
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  web:
    external: true

volumes:
  thales_uploads:
    driver: local